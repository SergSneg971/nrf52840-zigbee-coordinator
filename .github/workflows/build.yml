name: Build Zigbee Coordinator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CCACHE_DIR: /github/home/.ccache
  CCACHE_MAXSIZE: 500M

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: nordicplayground/nrfconnect-sdk:v2.7-branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends ccache libyaml-0-2 wget python3

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-coordinator-${{ hashFiles('prj.conf', 'pm_static.yml', 'app.overlay') }}
          restore-keys: |
            ccache-coordinator-

      - name: Build firmware
        shell: bash
        run: |
          TOOLCHAIN_DIR=$(find /root/ncs/toolchains -maxdepth 1 -mindepth 1 -type d | head -n 1)
          export PATH="$TOOLCHAIN_DIR/usr/local/bin:$TOOLCHAIN_DIR/usr/bin:$TOOLCHAIN_DIR/opt/zephyr-sdk/arm-zephyr-eabi/bin:$PATH"
          export LD_LIBRARY_PATH="$TOOLCHAIN_DIR/usr/local/lib:$TOOLCHAIN_DIR/usr/lib:$TOOLCHAIN_DIR/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH"
          export ZEPHYR_TOOLCHAIN_VARIANT=zephyr
          export ZEPHYR_SDK_INSTALL_DIR="$TOOLCHAIN_DIR/opt/zephyr-sdk"
          
          source /workdir/zephyr/zephyr-env.sh

          ccache -z
          west build -b nice_nano_v2 -d build -- \
           -DDTC_OVERLAY_FILE="$GITHUB_WORKSPACE/app.overlay" \
           -DPM_STATIC_YML_FILE="$GITHUB_WORKSPACE/pm_static.yml" \
           -DCMAKE_C_COMPILER_LAUNCHER=ccache \
           -DCMAKE_CXX_COMPILER_LAUNCHER=ccache


          ccache -s

      - name: Convert HEX to Adafruit UF2
        shell: bash
        run: |
          python3 /workdir/zephyr/scripts/build/uf2conv.py build/zephyr/zephyr.hex -c -f 0xADA52840 -o build/zephyr/nicenano_coordinator.uf2

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zigbee-coordinator-firmware
          path: |
            build/zephyr/zephyr.hex
            build/zephyr/nicenano_coordinator.uf2
