name: Build Zigbee Coordinator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CCACHE_DIR: /github/home/.ccache
  CCACHE_MAXSIZE: 500M

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: nordicplayground/nrfconnect-sdk:v2.7-branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ccache
        run: |
          apt-get update && apt-get install -y --no-install-recommends ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-coordinator-${{ hashFiles('prj.conf', 'pm_static.yml', 'app.overlay') }}
          restore-keys: |
            ccache-coordinator-

      - name: Build firmware
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:/root/.local/bin:$PATH"
          # Подключаем окружение nRF Connect SDK, если оно в /workdir или /opt/ncs
          if [ -f /workdir/zephyr/zephyr-env.sh ]; then
            source /workdir/zephyr/zephyr-env.sh
          elif [ -f /opt/ncs/zephyr/zephyr-env.sh ]; then
            source /opt/ncs/zephyr/zephyr-env.sh
          fi
          
          ccache -z
          west build -b nrf52840dk/nrf52840 -d build -- \
            -DDTC_OVERLAY_FILE=app.overlay \
            -DPM_STATIC_YML_FILE=pm_static.yml \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ccache -s

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zigbee-coordinator-firmware
          path: |
            build/zephyr/zephyr.hex
            build/zephyr/zephyr.uf2
