name: Build Zigbee Coordinator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CCACHE_DIR: /github/home/.ccache
  CCACHE_MAXSIZE: 500M

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nrfconnect/sdk-nrf:v2.7.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-coordinator-${{ hashFiles('prj.conf', 'pm_static.yml', 'app.overlay') }}
          restore-keys: |
            ccache-coordinator-

      - name: Build firmware
        run: |
          ccache -z
          west build -b nrf52840dk/nrf52840 -d build -- \
            -DDTC_OVERLAY_FILE=app.overlay \
            -DPM_STATIC_YML_FILE=pm_static.yml \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ccache -s

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zigbee-coordinator-firmware
          path: |
            build/zephyr/zephyr.hex
            build/zephyr/zephyr.uf2
