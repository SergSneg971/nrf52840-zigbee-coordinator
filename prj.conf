# Работа без внешнего кварца 32.768 кГц (внутренний RC-генератор)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# Разметка памяти под Adafruit UF2 Bootloader (старт с 0x1000)
CONFIG_USE_DT_CODE_PARTITION=n
CONFIG_FLASH_LOAD_OFFSET=0x1000
CONFIG_BUILD_OUTPUT_UF2=y

# Включаем криптографию AES ECB для стека Zigbee (ZBOSS)
CONFIG_CRYPTO=y
CONFIG_CRYPTO_NRF_ECB=y
CONFIG_ENTROPY_GENERATOR=y

# Включаем стек Zigbee, библиотеку NCP и последовательный транспорт NCP
CONFIG_ZIGBEE=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_COORDINATOR=y
CONFIG_ZIGBEE_LIBRARY_NCP_DEV=y
CONFIG_ZIGBEE_NCP_TRANSPORT_SERIAL=y

# Настройка виртуального COM-порта через USB (CDC ACM)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="nRF52840 Zigbee Coordinator"
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Отключаем логи в USB-порт, чтобы не ломать обмен с Home Assistant
CONFIG_LOG=n
CONFIG_SERIAL=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Увеличиваем стеки и буферы для стабильной работы Zigbee NCP
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=16384
