# Внутренний RC-генератор (на SuperMini нет внешнего кварца 32.768 кГц)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# Разметка под Adafruit UF2 Bootloader (старт с 0x1000)


CONFIG_BUILD_OUTPUT_UF2=y

# Криптография AES ECB для ZBOSS
CONFIG_CRYPTO=y
CONFIG_CRYPTO_NRF_ECB=y
CONFIG_ENTROPY_GENERATOR=y

# Стек Zigbee и режим NCP-координатора
CONFIG_ZIGBEE=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_COORDINATOR=y
CONFIG_ZIGBEE_LIBRARY_NCP_DEV=y

# Виртуальный COM-порт через USB (CDC ACM)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="SuperMini Zigbee Coordinator"
CONFIG_USB_CDC_ACM=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=1024
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Отключаем логи в USB, чтобы не портить бинарный протокол ZBOSS
CONFIG_LOG=n
CONFIG_SERIAL=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Память и стеки
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_GPIO=y
